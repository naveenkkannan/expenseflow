services:
  - type: web
    name: expense-flow-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build -w server
    startCommand: node server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SEED_EMAIL
        sync: false
      - key: SEED_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false
